name: Compilar APK Google TV Remote Pro

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Gradle 8.7 automatico (no requiere gradle-wrapper.jar)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. Compilar APK Debug instalable
        run: gradle assembleDebug --no-daemon

      - name: 5. Subir APK lista para descargar
        uses: actions/upload-artifact@v4
        with:
          name: GoogleTvRemotePro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
